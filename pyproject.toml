[project]
name = "neural-latent-lab"
version = "0.1.0"
description = "Laboratoire expérimental de raisonnement latent et communication émergente"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5"]
dev = ["pytest>=7.4"]

[project.scripts]
nll = "neural_latent_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
